<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Somtoday Card — fictieve preview</title>
    <style>
      :root{--primary:#65a1ff;--card:#fff;--text:#202124;--muted:#69717c;--line:#dce1e8;--page:#eef1f5;--slot:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--page);color:var(--text);font:14px system-ui,sans-serif}body.dark{--card:#202327;--text:#f3f5f7;--muted:#aeb5bf;--line:#383e46;--page:#111315;--slot:#262b31}body.narrow-preview{padding:12px}button{font:inherit}.frame{width:min(1450px,100%);margin:auto}.card{overflow:hidden;border-radius:14px;background:var(--card);box-shadow:0 2px 12px #0002}header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}.school-icon{width:25px;height:25px;color:var(--primary)}h1{margin:0;font-size:19px}.subtitle,.meta,.break,.empty-time{color:var(--muted);font-size:11px}.tabs,.week-switch{display:flex;align-items:center;gap:4px}.tabs{padding:0 12px 10px;overflow:hidden;border-bottom:1px solid var(--line)}.tab{flex:0 0 auto;border:0;border-radius:999px;padding:8px 11px;color:inherit;background:transparent}.tab.active{color:#fff;background:var(--primary)}.content{padding:12px}.week-switch{margin-bottom:10px}.arrow,.print{width:36px;height:36px;padding:0;font-size:22px;line-height:1}.print{margin-left:auto;font-size:18px}.week{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;overflow-x:auto}.day{min-width:0;padding:8px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 96%,var(--primary))}.day-title{display:flex;justify-content:space-between;padding:2px 4px 9px;font-weight:700}.count{color:var(--muted);font-size:11px}.planner,.lesson,.empty,.break{margin-bottom:7px;border-radius:9px}.planner{display:flex;align-items:center;justify-content:space-between;min-height:37px;padding:7px 9px;border:1px dashed var(--line);font-size:11px}.add{border:0;border-radius:999px;padding:5px 9px;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}.lesson{min-height:67px;padding:9px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}.subject{font-weight:700}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}.chips{margin-top:6px}.chip{display:inline-block;margin-right:4px;border-radius:999px;padding:2px 7px;color:#202124;font-size:10px;font-weight:700}.homework{background:#8be29a}.test{background:#ffbd72}.break{padding:7px 9px;border:1px dashed var(--line)}.empty{min-height:67px;padding:9px;border:1px dashed var(--line);border-left-width:4px;background:var(--slot)}.empty-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;font-weight:650}.empty-head span:last-child{text-align:right;white-space:nowrap}.empty-time{margin-top:5px}.privacy{margin:12px 2px 0;color:var(--muted);font-size:11px;text-align:right}.narrow{width:100%;max-width:406px}.narrow .tabs{gap:0}.narrow .tab{padding:8px 7px;font-size:12px}.narrow .week{grid-template-columns:1fr;overflow:visible}.narrow .day:not(:first-child),.narrow .print{display:none}@media(max-width:600px){body{padding:12px}.tabs{gap:0}.tab{padding:8px 7px;font-size:12px}.week{grid-template-columns:1fr;overflow:visible}.day:not(:first-child),.print{display:none}}
    </style>
  </head>
  <body>
    <main class="frame" id="frame"><section class="card">
      <header><svg class="school-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 3 10 5-10 5L2 8l10-5m6 8.5V16l-6 3-6-3v-4.5l6 3 6-3Z"/></svg><div><h1>Voorbeeldrooster</h1><div class="subtitle">Voorbeeldleerling · week 42</div></div></header>
      <nav class="tabs"><button class="tab">Vandaag</button><button class="tab">Morgen</button><button class="tab active">Week</button><button class="tab">Huiswerk</button><button class="tab">Toetsen</button></nav>
      <div class="content"><div class="week-switch" id="week-switch"><button class="tab active">Deze week</button><button class="tab">Volgende week</button><button class="tab arrow" title="Twee weken vooruit">›</button><button class="tab print" title="Afdrukken">▣</button></div><div class="week" id="week"></div><div class="privacy">Alle namen en roostergegevens in deze preview zijn fictief.</div></div>
    </section></main>
    <script>
      const days=[
        {title:"ma 12 okt",lessons:[[1,"Wiskunde","A101","Docent A","#35b7d4","homework"],[2,"Nederlands","B204","Docent B","#e92d82"],[4,"Biologie","C112","Docent C","#43d3a2","test"]]},
        {title:"di 13 okt",lessons:[[2,"Engels","B106","Docent D","#43d3a2","homework"],[3,"Geschiedenis","A203","Docent E","#a9ca18"],[6,"Muziek","Muzieklokaal","Docent F","#9942cd"]]},
        {title:"wo 14 okt",lessons:[[1,"Aardrijkskunde","C201","Docent G","#e92d82"],[2,"Lichamelijke opvoeding","Sportzaal","Docent H","#e92d82"],[5,"Rekenen","A104","Docent I","#35b7d4"]]},
        {title:"do 15 okt",lessons:[[1,"Techniek","T102","Docent J","#43d3a2"],[4,"Engels","B106","Docent D","#43d3a2","test"],[5,"Wiskunde","A101","Docent A","#35b7d4"]]},
        {title:"vr 16 okt",lessons:[[2,"Nederlands","B204","Docent B","#e92d82"],[3,"Biologie","C112","Docent C","#43d3a2","homework"],[6,"Mentoruur","A203","Docent E","#a9ca18"]]}
      ];
      const times={1:["08:30","09:15"],2:["09:15","10:00"],3:["10:00","10:45"],4:["11:00","11:45"],5:["11:45","12:30"],6:["13:00","13:45"]};
      function slot(day,period){if(period==="short")return`<div class="break">Korte pauze · 15 min · 10:45–11:00</div>`;if(period==="long")return`<div class="break">Lange pauze · 30 min · 12:30–13:00</div>`;const item=day.lessons.find(lesson=>lesson[0]===period),time=times[period];if(!item)return`<div class="empty"><div class="empty-head"><span>Lesuur ${period}</span><span>Geen les</span></div><div class="empty-time">${time[0]}–${time[1]}</div><button class="add">+ Toevoegen</button></div>`;const[,subject,room,teacher,color,work]=item;return`<div class="lesson" style="--accent:${color}"><div class="subject">${subject}</div><div class="meta"><span>Lesuur ${period}</span><span>${time[0]}–${time[1]}</span><span>${room}</span><span>${teacher}</span></div>${work?`<div class="chips"><span class="chip ${work}">${work==="test"?"Toets":"Huiswerk"}</span></div>`:""}</div>`}
      document.querySelector("#week").innerHTML=days.map(day=>`<section class="day"><div class="day-title"><span>${day.title}</span><span class="count">${day.lessons.length}</span></div><div class="planner"><span>Voor schooltijd</span><button class="add">+ Toevoegen</button></div>${[1,2,3,"short",4,5,"long",6].map(period=>slot(day,period)).join("")}<div class="planner"><span>Na schooltijd</span><button class="add">+ Toevoegen</button></div></section>`).join("");
      const params=new URLSearchParams(location.search);if(params.get("theme")==="dark")document.body.classList.add("dark");if(params.get("size")==="narrow"){document.body.classList.add("narrow-preview");document.querySelector("#frame").classList.add("narrow")}if(params.get("week")==="future")document.querySelector("#week-switch").innerHTML='<button class="tab">Deze week</button><button class="tab arrow" title="Vorige week">‹</button><button class="tab active">2 weken</button><button class="tab arrow" title="Volgende week">›</button><button class="tab print" title="Afdrukken">▣</button>';
    </script>
  </body>
</html>
