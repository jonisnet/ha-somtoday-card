<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Somtoday Card preview</title>
    <style>
      :root{--primary-color:#03a9f4;--card-background-color:#fff;--primary-text-color:#202124;--secondary-text-color:#6b7280;--divider-color:#dfe3e8;--error-color:#db4437;--warning-color:#f59e0b;--page:#eef1f5}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--primary-text-color);font:14px system-ui;padding:28px}.dark{--card-background-color:#20242a;--primary-text-color:#f2f5f7;--secondary-text-color:#aab2bd;--divider-color:#3b424c;--page:#111418}.frame{margin:auto;width:min(1120px,100%)}.frame.narrow{max-width:390px}.card{overflow:hidden;border-radius:14px;background:var(--card-background-color);box-shadow:0 2px 10px #0002}.header{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}.icon{color:var(--primary-color);font-size:25px}.heading{flex:1}.heading h2{margin:0;font-size:20px}.sub{color:var(--secondary-text-color);font-size:12px}.tabs{display:flex;gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--divider-color)}.tab{border:0;border-radius:999px;background:transparent;color:inherit;padding:8px 12px}.tab.active{background:var(--primary-color);color:white}.content{padding:14px}.week{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;overflow:auto}.narrow .week{grid-template-columns:1fr}.day{border:1px solid var(--divider-color);border-radius:12px;padding:8px;background:color-mix(in srgb,var(--card-background-color) 94%,var(--primary-color))}.day-title{display:flex;justify-content:space-between;padding:2px 4px 8px;font-weight:650}.count{color:var(--secondary-text-color);font-size:11px}.lesson{border-left:4px solid var(--c,var(--primary-color));border-radius:9px;padding:9px;margin-bottom:7px;background:color-mix(in srgb,var(--c,var(--primary-color)) 10%,var(--card-background-color))}.lesson.current{box-shadow:0 0 0 2px var(--primary-color)}.lesson.cancelled{--c:var(--error-color);opacity:.76;text-decoration:line-through}.lesson.changed{border-color:var(--warning-color)}.lesson.missing{border:1px dashed var(--warning-color);border-left-width:4px;background:transparent;color:var(--secondary-text-color)}.head{display:flex;justify-content:space-between;gap:4px;font-weight:650}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;color:var(--secondary-text-color);font-size:11px}.badge{border-radius:999px;padding:2px 6px;font-size:10px;background:color-mix(in srgb,var(--warning-color) 18%,transparent)}
    </style>
  </head>
  <body>
    <main class="frame" id="frame"><section class="card"><header class="header"><span class="icon">◉</span><div class="heading"><h2>School</h2><div class="sub">Leerling · week 36</div></div></header><nav class="tabs"><button class="tab">Vandaag</button><button class="tab active">Week</button><button class="tab">Huiswerk</button><button class="tab">Toetsen</button></nav><div class="content"><div class="week" id="week"></div></div></section></main>
    <script>
      const data=[['ma 31 aug',[['Wiskunde','08:30–09:15','204','wi'],['Engels','09:15–10:00','112','en'],['Biologie','10:15–11:00','301','bio']]],['di 1 sep',[['Nederlands','08:30–09:15','205','nl'],['M&M','10:15–11:00','118','mm','changed','Ander lokaal'],['Gym','13:00–14:30','Sporthal','gym']]],['wo 2 sep',[['Wiskunde','08:30–09:15','204','wi','current','Nu bezig'],['Engels','09:15–10:00','112','en'],['Biologie','10:15–11:00','301','bio','cancelled','Vervallen']]],['do 3 sep',[['Nederlands','09:15–10:00','205','nl'],['Techniek','11:00–11:45','020','tech'],['Muziek','12:15–13:00','Aula','music']]],['vr 4 sep',[['Wiskunde','08:30–09:15','204','wi'],['Biologie','10:00–10:45','301','bio','missing','Verdwenen uit rooster'],['Engels','11:00–11:45','112','en']]]];
      const colors={wi:'#3867d6',en:'#20bf6b',bio:'#a55eea',nl:'#eb3b5a',mm:'#f7b731',gym:'#26de81',tech:'#778ca3',music:'#fd9644'};document.querySelector('#week').innerHTML=data.map(([day,lessons])=>`<section class="day"><div class="day-title"><span>${day}</span><span class="count">${lessons.length}</span></div>${lessons.map(([subject,time,room,key,state,badge])=>`<div class="lesson ${state||''}" style="--c:${colors[key]}"><div class="head"><span>${subject}</span>${badge?`<span class="badge">${badge}</span>`:''}</div><div class="meta"><span>${time}</span><span>${room}</span></div></div>`).join('')}</section>`).join('');const params=new URLSearchParams(location.search);if(params.get('theme')==='dark')document.body.classList.add('dark');if(params.get('size')==='narrow')document.querySelector('#frame').classList.add('narrow');
    </script>
  </body>
</html>
